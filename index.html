<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karim's AI Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      text-align: center;
      padding: 40px;
    }
    #chat {
      border: 1px solid #334155;
      border-radius: 10px;
      background: #1e293b;
      width: 90%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      text-align: left;
      overflow-y: auto;
      height: 300px;
    }
    input {
      width: 70%;
      padding: 10px;
      border-radius: 5px;
      border: none;
      margin-top: 10px;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      margin-left: 5px;
    }
    .message { margin: 8px 0; }
    .user { color: #22c55e; }
    .bot { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>🧠 Karim's AI Assistant</h1>
  <div id="chat">
    <div class="bot message">AI: Hi Karim! I’m your assistant. How can I help you today?</div>
  </div>
  <input id="userInput" placeholder="Say or type something..." />
  <button onclick="sendMessage()">Send</button>
  <button onclick="startVoice()">🎤 Speak</button>

  <script>
    const chat = document.getElementById("chat");

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = `message ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;
      addMessage("You: " + message, "user");
      input.value = "";

      // Simple local AI replies
      let reply = "I'm your assistant! You said: " + message;
      const lower = message.toLowerCase();
      if (lower.includes("hello")) reply = "Hey there! How are you doing?";
      else if (lower.includes("homework")) reply = "Sure! Tell me your homework question and I’ll help.";
      else if (lower.includes("who are you")) reply = "I’m your personal AI assistant built by Karim!";
      else if (lower.includes("bye")) reply = "Goodbye! Talk to you soon.";

      addMessage("AI: " + reply, "bot");
      speak(reply);
    }

    // 🎤 Voice input
    function startVoice() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.onresult = (event) => {
        document.getElementById("userInput").value = event.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    }

    // 🔊 Voice output
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
