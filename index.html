<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kariai Chat</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #chat {
            width: 100%;
            max-width: 600px;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 10px;
            min-height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .user, .kariai {
            margin: 10px 0;
        }
        .user { text-align: right; }
        .kariai { text-align: left; font-style: italic; }
        #inputArea {
            display: flex;
            width: 100%;
            max-width: 600px;
        }
        #inputArea input {
            flex: 1;
            padding: 10px;
            border-radius: 5px 0 0 5px;
            border: none;
        }
        #inputArea button {
            padding: 10px;
            border: none;
            background-color: #1f1f1f;
            color: #fff;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
        }
        .typing {
            border-right: 2px solid #fff;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: blink-caret 0.8s step-end infinite;
        }
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: white; }
        }
    </style>
</head>
<body>
    <h1>Kariai Chat</h1>
    <div id="chat"></div>
    <div id="inputArea">
        <input type="text" id="userInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script type="module">
        import { API_KEY } from './config.js';

        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';

            const kariaiMessage = await getKariaiReply(message);
            await typeMessage(kariaiMessage);
            speakMessage(kariaiMessage);
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = sender;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function typeMessage(text) {
            return new Promise(resolve => {
                const div = document.createElement('div');
                div.className = 'kariai typing';
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;

                let i = 0;
                const interval = setInterval(() => {
                    div.textContent = text.slice(0, i+1);
                    i++;
                    chat.scrollTop = chat.scrollHeight;
                    if (i === text.length) {
                        clearInterval(interval);
                        div.classList.remove('typing');
                        resolve();
                    }
                }, 40); // typing speed
            });
        }

        function speakMessage(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = speechSynthesis.getVoices().find(v => v.name.includes('Male')) || null;
            speechSynthesis.speak(utterance);
        }

        async function getKariaiReply(userMessage) {
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "You are Kariai, a futuristic AI assistant with a deep male voice." },
                            { role: "user", content: userMessage }
                        ]
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (err) {
                return "Oops! I couldn't connect to Kariai.";
            }
        }
    </script>
</body>
</html>
