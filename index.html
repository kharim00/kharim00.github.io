<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KariAI - Your Futuristic Assistant</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #0a0a0a, #050505);
      color: #e2e8f0;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2rem;
      color: #38bdf8;
    }

    #chat {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #334155;
      border-radius: 15px;
      width: 90%;
      max-width: 550px;
      height: 350px;
      overflow-y: auto;
      padding: 20px;
      margin: 20px auto;
      text-align: left;
    }

    input {
      width: 70%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-left: 8px;
      transition: 0.3s;
    }

    button:hover {
      background: #2563eb;
    }

    .message {
      margin: 10px 0;
    }

    .user {
      color: #22c55e;
    }

    .bot {
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <h1>🤖 KariAI - Your Futuristic Assistant</h1>
  <div id="chat">
    <div class="bot message">KariAI: Hello, I’m your assistant. How can I help you today?</div>
  </div>
  <input id="userInput" placeholder="Type or say something..." />
  <button onclick="sendMessage()">Send</button>
  <button onclick="startVoice()">🎤 Speak</button>

  <script>
    const chat = document.getElementById("chat");

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = `message ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;
      addMessage("You: " + message, "user");
      input.value = "";

      addMessage("KariAI: ...thinking...", "bot");

      try {
        // 🔥 Real AI response using OpenAI API
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "sk-...uKcA"
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: message }]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || "Hmm... I didn’t get that.";
        document.querySelectorAll(".bot").slice(-1)[0]?.remove();
        addMessage("KariAI: " + reply, "bot");
        speak(reply);

      } catch (error) {
        addMessage("KariAI: Sorry, something went wrong.", "bot");
      }
    }

    // 🎤 Voice input
    function startVoice() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.onresult = (event) => {
        document.getElementById("userInput").value = event.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    }

    // 🔊 Male voice output
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.pitch = 1;
      utterance.rate = 1;
      utterance.voice = speechSynthesis.getVoices().find(v => v.name.includes("Male")) || null;
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
